<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1d7a6d"/>
      <stop offset="1" stop-color="#0a3230"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe3d4"/>
      <stop offset="1" stop-color="#5ad1c0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#031a18" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#5ad1c0" stroke-width="3" opacity="0.22"/>

  <g filter="url(#sh)">
    <!-- 杖 -->
    <rect x="243" y="118" width="26" height="286" rx="13" fill="#eaf6f4"/>
    <!-- 杖顶圆球 -->
    <circle cx="256" cy="106" r="27" fill="#eaf6f4"/>
    <!-- 蛇身：两道缠绕弧 -->
    <path d="M138 214 C138 150 374 150 374 214" stroke="url(#snake)" stroke-width="27"
          fill="none" stroke-linecap="round"/>
    <path d="M374 286 C374 350 138 350 138 286" stroke="url(#snake)" stroke-width="27"
          fill="none" stroke-linecap="round"/>
    <!-- 蛇头 -->
    <ellipse cx="138" cy="286" rx="26" ry="23" fill="#7fe3d4"/>
    <!-- 蛇眼 -->
    <circle cx="131" cy="281" r="4.6" fill="#0a3230"/>
  </g>

  <!-- 底部文字 -->
  <text x="256" y="452" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif"
        font-size="62" font-weight="700" fill="#cdeee8" letter-spacing="6">蛇杖</text>
</svg>
